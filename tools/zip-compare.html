<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مقایسه‌ی zip پروژه · DANI</title>
<style>
:root{--bg:#0f1b2d;--c:#162640;--b:#2a3f60;--t:#eaf0fb;--m:#9fb2cf;--ac:#7cb4ff;--ok:#34c38f;--wr:#f5b301;--er:#ef5b5b}
@media (prefers-color-scheme:light){:root{--bg:#f4f7fc;--c:#fff;--b:#d5deec;--t:#142033;--m:#5a6b85;--ac:#1f6fe0;--ok:#168a5f;--wr:#b07d00;--er:#c23a3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.7 Tahoma,"Vazirmatn",system-ui,sans-serif;padding:14px;max-width:820px;margin-inline:auto}
h1{font-size:19px;margin:6px 0}h2{font-size:15px;margin:0 0 8px}.c{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px 14px;margin:12px 0}
.m{color:var(--m);font-size:13px}label.f{display:block;border:1.5px dashed var(--b);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}label.f:hover{border-color:var(--ac)}
label.f b{display:block}input[type=file]{display:none}.fn{color:var(--ac);font-size:13px;direction:ltr;text-align:right;word-break:break-all}
button{font:inherit;min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}button:disabled{opacity:.45;cursor:default}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{text-align:center;border:1px solid var(--b);border-radius:12px;padding:8px 4px}.s b{display:block;font-size:22px}
.new b{color:var(--ok)}.chg b{color:var(--wr)}.del b{color:var(--er)}
ul{margin:6px 0;padding:0;list-style:none}li{padding:3px 0;border-bottom:1px dotted var(--b);direction:ltr;text-align:left;font-size:13px;word-break:break-all}li small{color:var(--m)}
.w li{direction:rtl;text-align:right}.tag{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;margin-inline-end:6px;color:#fff}
.t-er{background:var(--er)}.t-wr{background:var(--wr)}.t-ok{background:var(--ok)}
details{margin:6px 0}summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<h1>🔎 مقایسه‌ی دو zip از پروژه</h1>
<p class="m">همه‌چیز داخل مرورگر خودت انجام می‌شود؛ فایلی به جایی ارسال نمی‌شود و Python لازم نیست. zip نسخه‌ی فعلی (آنچه الان در GitHub است) و zip نسخه‌ی جدید را بده تا ببینی چه چیزی عوض شده، و فقط تغییرها را برای آپلود بگیری.</p>

<div class="c">
 <label class="f"><b>۱) zip قدیمی (نسخه‌ی فعلی) — اختیاری</b><span class="m">اگر ندهی، فقط zip جدید بررسی می‌شود.</span><input type="file" id="fa" accept=".zip"><span class="fn" id="na"></span></label>
 <label class="f"><b>۲) zip جدید</b><input type="file" id="fb" accept=".zip"><span class="fn" id="nb"></span></label>
 <button class="p" id="go" disabled>مقایسه کن</button>
 <div class="m" id="msg" style="margin-top:8px"></div>
</div>
<div id="out"></div>

<script>
"use strict";
const $=id=>document.getElementById(id),dec=new TextDecoder('utf-8'),enc=new TextEncoder();
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let A=null,B=null,files={a:null,b:null},lastChanged=[];
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const rf=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('خواندن فایل ممکن نشد'));r.readAsArrayBuffer(f)});
async function parseZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-22-65535);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('این فایل zip معتبر نیست یا ناقص است');
  const n=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true),list=[];let p=off;
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('فهرست داخلی zip خراب است');
    const meth=dv.getUint16(p+10,true),crc=dv.getUint32(p+16,true),cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!name.endsWith('/'))list.push({name,meth,crc,cs,us,lo});
  }
  // حذف پوشه‌ی بالاییِ مشترک (مثلاً DANI_PLANNER-main/) و فایل‌های بی‌ارزش
  const ok=list.filter(x=>!/(^|\/)(__MACOSX|\.DS_Store)/.test(x.name));
  let pre='';if(ok.length&&ok.every(x=>x.name.includes('/'))){const f=ok[0].name.split('/')[0]+'/';if(ok.every(x=>x.name.startsWith(f)))pre=f}
  const m=new Map();ok.forEach(x=>{x.path=x.name.slice(pre.length);m.set(x.path,x)});
  async function read(x){
    const st=x.lo+30+dv.getUint16(x.lo+26,true)+dv.getUint16(x.lo+28,true),raw=u8.subarray(st,st+x.cs);
    if(x.meth===0)return raw.slice();
    if(x.meth!==8)throw new Error('روش فشرده‌سازی پشتیبانی نمی‌شود: '+x.path);
    if(typeof DecompressionStream==='undefined')throw new Error('این مرورگر باز کردن zip فشرده را پشتیبانی نمی‌کند (Chrome/Edge جدید لازم است)');
    return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }
  return{map:m,pre,read};
}
function zipStore(items){ // items:[{path,data,crc}]
  const parts=[],cd=[];let off=0;const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of items){const nm=enc.encode(f.path),c=f.crc>>>0,d=f.data;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+d.length}
  let s=0;cd.forEach(x=>s+=x.length);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(items.length),...u16(items.length),...u32(s),...u32(off),0,0]);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function audit(Z){ // هشدارهای ساختاری روی zip جدید
  const w=[],paths=[...Z.map.keys()],base=p=>p.split('/').pop();
  // نام‌های سرگردان مثل index-1.html یا file (1).js
  paths.forEach(p=>{const b=base(p),m=b.match(/^(.*?)(?:-\d+| \(\d+\)|_\d+)(\.[A-Za-z0-9]+)$/);
    if(m){const orig=(p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'')+m[1]+m[2];if(Z.map.has(orig)){const same=Z.map.get(orig).crc===Z.map.get(p).crc;w.push(['er',`<b>${E(p)}</b> کپی سرگردانِ <b>${E(orig)}</b> است ${same?'(محتوا کاملاً یکسان)':'(محتوا فرق دارد!)'} — از GitHub حذفش کن و نام فایل‌ها را بدون «-1» یا «(1)» آپلود کن`])}}});
  // یک فایل با نام یکسان و محتوای یکسان در دو پوشه
  const by=new Map();paths.forEach(p=>{const x=Z.map.get(p);if(x.us<300)return;const k=base(p)+'|'+x.crc+'|'+x.us;(by.get(k)||by.set(k,[]).get(k)).push(p)});
  by.forEach(v=>{if(v.length>1)w.push(['wr',`فایل یکسان در چند مسیر: <b>${v.map(E).join('</b> ، <b>')}</b> — معمولاً یکی‌اش اضافی است`])});
  return w;
}
async function checkRefs(Z){ // index.html و sw.js
  const w=[];
  try{
    if(Z.map.has('index.html')){const h=dec.decode(await Z.read(Z.map.get('index.html')));
      const refs=[...h.matchAll(/(?:src|href)="([^"#?:]+?)(?:\?[^"]*)?"/g)].map(m=>m[1]).filter(r=>!/^(https?:|data:|\/\/)/.test(r));
      const miss=[...new Set(refs)].filter(r=>!Z.map.has(r)&&r!=='./'&&r!=='');
      if(miss.length)w.push(['er','فایل‌هایی که <b>index.html</b> صدا می‌زند ولی در zip نیست: <b>'+miss.map(E).join('</b> ، <b>')+'</b>']);else w.push(['ok','همه‌ی فایل‌های index.html در zip هستند']);
      const ver=[...h.matchAll(/\?v=(\d+)/g)].map(m=>m[1]);if(ver.length)w.push(['ok','شماره‌ی نسخه‌ی index.html: '+[...new Set(ver)].join('، ')])}
    if(Z.map.has('sw.js')){const s=dec.decode(await Z.read(Z.map.get('sw.js'))),m=s.match(/PRECACHE\s*=\s*\[([\s\S]*?)\]/);
      if(m){const list=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]).filter(x=>x!=='./');const miss=list.filter(x=>!Z.map.has(x.split('?')[0]));
        if(miss.length)w.push(['er','در فهرست آفلاین <b>sw.js</b> هست ولی در zip نیست: <b>'+miss.map(E).join('</b> ، <b>')+'</b>']);
        const js=[...Z.map.keys()].filter(p=>/^js\/.+\.js$/.test(p)&&!list.includes(p));
        if(js.length)w.push(['wr','این فایل‌های js در فهرست آفلاین <b>sw.js</b> نیستند (بدون اینترنت بالا نمی‌آیند): <b>'+js.map(E).join('</b> ، <b>')+'</b> — update-sw را اجرا کن یا از هوش مصنوعی بخواه']);}}
  }catch(e){w.push(['wr','بررسی index.html/sw.js ممکن نشد: '+E(e.message)])}
  return w;
}
function listHTML(title,cls,arr,withSize){
  if(!arr.length)return'';
  return`<details ${arr.length<=25?'open':''}><summary class="${cls}">${title} (${arr.length})</summary><ul>${arr.map(x=>`<li>${E(x.p)} <small>${withSize?kb(x.size)+(x.old!=null?' ← '+kb(x.old):''):''}</small></li>`).join('')}</ul></details>`;
}
async function run(){
  $('msg').textContent='در حال خواندن…';$('out').innerHTML='';$('go').disabled=true;
  try{
    B=await parseZip(await rf(files.b));A=files.a?await parseZip(await rf(files.a)):null;
    const nw=[],ch=[],del=[],same=[];
    if(A){B.map.forEach((x,p)=>{const o=A.map.get(p);if(!o)nw.push({p,size:x.us});else if(o.crc!==x.crc||o.us!==x.us)ch.push({p,size:x.us,old:o.us});else same.push({p,size:x.us})});A.map.forEach((x,p)=>{if(!B.map.has(p))del.push({p,size:x.us})})}
    lastChanged=[...nw,...ch].map(x=>x.p).sort();
    const w=[...audit(B),...await checkRefs(B)];
    if(A){['PROJECT.md','CODE-MAP.md','GUIDE-FA.md','CHANGELOG.md'].forEach(d=>{if(B.map.has(d)&&!A.map.has(d))w.push(['wr',`فایل مستند <b>${d}</b> در zip قدیمی نبود و در جدید هست`]);if(!B.map.has(d)&&d!=='CHANGELOG.md')w.push(['wr',`فایل مستند <b>${d}</b> داخل zip جدید نیست؛ یک نسخه‌ی جدا از آن در جای دیگری نگه نداری که با این از هم فاصله بگیرد`])})}
    let h='';
    if(A)h+=`<div class="c"><h2>خلاصه</h2><div class="g"><div class="s new"><b>${nw.length}</b>جدید</div><div class="s chg"><b>${ch.length}</b>تغییرکرده</div><div class="s del"><b>${del.length}</b>حذف‌شده</div><div class="s"><b>${same.length}</b>بدون تغییر</div></div>
      <p class="m">پوشه‌ی بالای zip قدیمی: «${E(A.pre||'—')}» · جدید: «${E(B.pre||'—')}» (در مقایسه نادیده گرفته می‌شود)</p></div>
      <div class="c"><h2>فقط این‌ها را آپلود کن (${lastChanged.length} فایل)</h2>${lastChanged.length?`<p class="m">دکمه‌ی زیر یک zip با فقط همین فایل‌ها و همان پوشه‌بندی می‌سازد. فایل‌های حذف‌شده را اگر بخواهی خودت از GitHub پاک می‌کنی.</p><button class="p" id="mk">ساخت zip فقط تغییرها</button> <button id="cp">کپی فهرست</button>`:'<p>تغییری نیست.</p>'}</div>
      <div class="c">${listHTML('🟢 جدید','',nw,true)}${listHTML('🟡 تغییرکرده','',ch,true)}${listHTML('🔴 حذف‌شده (در zip جدید نیست)','',del,true)}<details><summary>⚪ بدون تغییر (${same.length})</summary><ul>${same.map(x=>`<li>${E(x.p)}</li>`).join('')}</ul></details></div>`;
    else h+=`<div class="c"><h2>zip جدید</h2><p>${B.map.size} فایل</p></div>`;
    h+=`<div class="c w"><h2>بررسی ساختار</h2>${w.length?`<ul>${w.map(([k,t])=>`<li><span class="tag t-${k}">${k==='er'?'خطا':k==='wr'?'هشدار':'خوب'}</span>${t}</li>`).join('')}</ul>`:'<p>مورد خاصی پیدا نشد.</p>'}</div>`;
    $('out').innerHTML=h;$('msg').textContent='';
    if($('mk'))$('mk').onclick=async()=>{try{$('mk').disabled=true;const items=[];for(const p of lastChanged){const x=B.map.get(p);items.push({path:p,data:await B.read(x),crc:x.crc})}
      const bl=zipStore(items),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='DANI-changes-'+new Date().toISOString().slice(0,10)+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);$('msg').textContent='zip ساخته شد: '+items.length+' فایل'}catch(e){$('msg').textContent='خطا: '+e.message}$('mk').disabled=false};
    if($('cp'))$('cp').onclick=()=>{const t=lastChanged.join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('msg').textContent='فهرست کپی شد',()=>{prompt('فهرست را کپی کن:',t)})};
  }catch(e){$('msg').textContent='خطا: '+e.message;$('out').innerHTML=''}
  $('go').disabled=!files.b;
}
$('fa').onchange=e=>{files.a=e.target.files[0]||null;$('na').textContent=files.a?files.a.name:''};
$('fb').onchange=e=>{files.b=e.target.files[0]||null;$('nb').textContent=files.b?files.b.name:'';$('go').disabled=!files.b};
$('go').onclick=run;
window.__zc={parseZip,zipStore,run};
</script>
</body>
</html>
